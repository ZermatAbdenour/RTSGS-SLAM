# ── Camera intrinsics (TUM defaults) ──────────────────────────────────────────
camera:
  rgb:
    fx: 525.0
    fy: 525.0
    cx: 319.5
    cy: 239.5
    width: 640
    height: 480
  depth:
    fx: 525.0
    fy: 525.0
    cx: 319.5
    cy: 239.5
    width: 640
    height: 480
  T_depth_to_rgb: null
  depth_scale: 5000.0

# ── Gaussian splatting ────────────────────────────────────────────────────────
gaussian_splatting:
  voxel_size: 0.05
  novelty_voxel: ${gaussian_splatting.voxel_size}
  projection_depth_diff_threshold_m: 0.10
  sh_degree: 1
  sigma_px: 4.0
  sigma_z0: 0.005
  sigma_z1: 0.0
  alpha_init: 0.5
  alpha_min: 0.01
  alpha_max: 0.98
  alpha_depth_scale: 0.0
  points_lr_mult: 0.3
  depth_loss_weight: 0.5
  pack_offset: 1000000
  depth_min: 0.10
  depth_max: 8.0
  depth_edge_threshold_m: 0.03
  pixel_subsample: 1.0

# ── Tracker ───────────────────────────────────────────────────────────────────
tracker:
  kf_translation: 0.02
  kf_rotation: 0.08726646   # 5 * pi / 180
  use_rendered_depth_icp: true
  cuda_device: 0
  depth_min: 0.10
  depth_max: 8.0
  icp_stride: 4
  icp_max_iters: 12
  icp_corr_dist: 0.12
  icp_min_pairs: 1200
  icp_huber_delta: 0.02
  icp_damping: 0.00001
  icp_plane_residual_max: 0.04
  icp_use_projective: true
  icp_proj_depth_max_diff: 0.08
  depth_median_ksize: 5
  depth_bilateral_d: 5
  depth_bilateral_sigma_color: 0.04
  depth_bilateral_sigma_space: 2.0

# ── Semantic segmentation (Mask2Former) ───────────────────────────────────────
segmentation:
  enabled: true
  model_id: "facebook/mask2former-swin-large-ade-panoptic"
  min_confidence: 0.25
  assignment_min_confidence: 0.4
  max_detections: 64
  update_stride: 10
  decay_factor: 0.98
  challenger_decay_factor: 0.98
  min_semantic_confidence: 0.2
  ema_alpha: 1.0
  switch_margin: 0.08
  switch_support_frames: 3
  switch_cooldown_frames: 2
  depth_tolerance_m: 0.08
  cull_near: 0.05
  cull_far: 50.0
  cull_pad_px: 2.0
  mask_threshold: 0.5
  mask_erode_px: 10
  mask_pad_px: 0
  depth_edge_reject_enabled: true
  depth_edge_threshold_m: 0.05

# ── Instance tracking ─────────────────────────────────────────────────────────
instance:
  min_points: 30
  iou_gate: 0.15
  center_gate_m: 0.30
  overlap_gate: 0.12
  partial_overlap_gate: 0.08
  bbox_expand_ratio: 0.2
  merge_min_ratio: 0.2
  max_missed_frames: 30
  bbox_quantile: 0.03
  bbox_merge_iou: 0.05
  bbox_merge_center_gate_m: 0.25

# ── Scene graph ───────────────────────────────────────────────────────────────
scenegraph:
  enabled: true
  max_objects_per_keyframe: 0
  update_stride: 10
  max_nodes: 48
  max_relations: 256
  rel_threshold: 0.5
  instance_ttl: 30
  instance_merge_dist: 0.6
  ema_momentum: 0.3
  relation_decay: 0.95
  relation_head_checkpoint: "Datasets/3RScan/3RScan/data/scans/relation_branch_hard_negative_bce.pt"
  relationships_path: "Datasets/3DSSG/3DSSG/relationships.txt"
  min_mask_pixels: 200